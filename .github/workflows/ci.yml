name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fail on leftover merge-conflict markers
        run: |
          if grep -REn '^(<<<<<<< |=======$|>>>>>>> )' --include='*.py' gvm; then
            echo "::error::Unresolved merge-conflict markers found"
            exit 1
          fi

      - name: Install package
        run: python -m pip install --upgrade pip && pip install .

      - name: Byte-compile all modules
        run: python -m compileall -q gvm

      - name: Import core (non-GUI) modules
        run: python -c "import gvm.main, gvm.extensions, gvm.install, gvm.cache"

      - name: Smoke-test the CLI
        run: |
          gvm --help
          gvm prefs show
