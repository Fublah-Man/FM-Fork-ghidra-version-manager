[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-version-manager"
version = "0.3"
description = "Ghidra Version Manager - Python conversion"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Fublah-Man", email = "fublahman@gmail.com"},
    {name = "CUB3D", email = "callumthom11@gmail.com"},
]
readme = "README.md"
keywords = ["ghidra"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tqdm>=4.67",
    "tomli-w>=1.1",
    "pillow>=11.0",
]

[project.optional-dependencies]
notifications = ["plyer>=2.1"]
gui = ["customtkinter>=5.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
gvm = "gvm.main:main"

[project.gui-scripts]
gvm-gui = "gvm.gui:launch_gui"

[project.urls]
Python_Repository = "https://github.com/Fublah-Man/FM-Fork-ghidra-version-manager"
Rust_Repository = "https://github.com/CUB3D/ghidra-version-manager"

[tool.setuptools.packages.find]
where = ["."]
include = ["gvm*"]

[tool.setuptools.package-data]
gvm = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# F=pyflakes (unused/undefined), I=import order, B=bugbear, UP=pyupgrade.
# Line length (E501) is intentionally not enforced to avoid churn.
select = ["F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The GUI module leans on customtkinter/tkinter dynamics; type-checking it is
# noisy and low-value, so it's excluded for now.
exclude = ["gvm/gui\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
