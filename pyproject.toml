[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-version-manager"
version = "0.4"
description = "Ghidra Version Manager - Python conversion"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Fublah-Man", email = "fublahman@gmail.com"},
    {name = "CUB3D", email = "callumthom11@gmail.com"},
]
readme = "README.md"
keywords = ["ghidra"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "tqdm>=4.67,<5",
    "tomli-w>=1.1,<2",
    "pillow>=11.0,<13",
]

[project.scripts]
gvm = "gvm.main:main"

[project.gui-scripts]
gvm-gui = "gvm.gui:launch_gui"

[project.urls]
Python_Repository = "https://github.com/Fublah-Man/FM-Fork-ghidra-version-manager"
Rust_Repository = "https://github.com/CUB3D/ghidra-version-manager"

[tool.setuptools.packages.find]
where = ["."]
include = ["gvm*"]

[tool.setuptools.package-data]
# py.typed advertises inline type information (PEP 561).
# extensions-repo/ is the bundled extension registry — it MUST ship inside the
# package. It previously lived at the repo root, which meant it was absent from
# every non-editable install and `gvm extensions list` silently showed nothing.
# res/ holds the macOS .app Info.plist template, needed by `install` on darwin.
gvm = ["py.typed", "extensions-repo/*.toml", "res/*.plist"]

[project.optional-dependencies]
notifications = ["plyer>=2.1"]
gui = ["customtkinter>=5.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# F=pyflakes (unused/undefined names), I=import order, B=bugbear (likely bugs),
# UP=pyupgrade. Line length (E501) is deliberately not enforced: the codebase
# has long explanatory comments and wrapping them would be churn for no gain.
select = ["F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# gui.py leans heavily on customtkinter/tkinter dynamic attributes; type-checking
# it produces noise rather than signal, so it's excluded until the tab split
# lands and the logic moves into gvm/service.py (which IS checked).
exclude = ["gvm/gui\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
